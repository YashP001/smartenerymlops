services:
  - type: web
    name: smart-home-energy-advisor
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install --no-cache-dir -r requirements-inference.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /ready
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MLFLOW_DISABLE_AGENT_HINT
        value: "1"
      - key: MONITORING_DB_PATH
        value: data/monitoring/predictions.db
