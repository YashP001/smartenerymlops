# Opt-in local presentation stack. Never mounts data/monitoring or changes Render.
# docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile continuous-monitoring up --build -d
services:
  api:
    image: smart-home-energy-advisor-demo:local
    environment:
      MONITORING_DB_PATH: /app/data/monitoring/predictions.db
      ENERGY_MODEL_PATH: /app/models/gradient_boosting.pkl
      MONITORING_SQLITE_SYNCHRONOUS: NORMAL
    volumes:
      - monitoring_demo_data:/app/data/monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]

  monitor:
    image: smart-home-energy-advisor-demo:local
    pull_policy: never  # Reuse the image built by the API service in this stack.
    profiles: ["continuous-monitoring"]
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      MONITORING_DB_PATH: /app/demo-monitoring/predictions.db
      MONITORING_SQLITE_SYNCHRONOUS: NORMAL
    volumes:
      - ./reports/demo/continuous:/app/reports/demo/continuous
      - monitoring_demo_data:/app/demo-monitoring
      - ./scripts:/app/scripts:ro
      - ./data/train.csv:/app/demo-data/train.csv:ro
      - ./data/test.csv:/app/demo-data/test.csv:ro
    command:
      - python
      - scripts/run_continuous_monitoring_demo.py
      - run
      - --api-url
      - http://api:8000
      - --reference
      - /app/demo-data/train.csv
      - --test
      - /app/demo-data/test.csv
      - --db
      - /app/demo-monitoring/predictions.db
      - --interval
      - "10"
      - --degradation-input
      - sensor_drift
    networks:
      - energy_advisor_network
    depends_on:
      api:
        condition: service_healthy

volumes:
  monitoring_demo_data:
    driver: local
