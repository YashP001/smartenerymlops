services:
  # ─── FastAPI Inference Service ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-home-energy-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONITORING_DB_PATH=/app/data/monitoring/predictions.db
      - PYTHONUNBUFFERED=1
      - MLFLOW_DISABLE_AGENT_HINT=1
    volumes:
      - ./data/monitoring:/app/data/monitoring
    networks:
      - energy_advisor_network
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Prometheus Metrics Collector & Time-Series DB ─────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: smart-home-energy-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - energy_advisor_network
    depends_on:
      api:
        condition: service_healthy

  # ─── Grafana Observability Dashboards ───────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: smart-home-energy-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - energy_advisor_network
    depends_on:
      - prometheus

networks:
  energy_advisor_network:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
